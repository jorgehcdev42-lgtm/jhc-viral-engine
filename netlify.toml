[build]
  publish = "frontend"
  command = "echo 'Static frontend — backend deploys separately on Render'"

[[redirects]]
  from = "/api/*"
  to = "https://jhc-viral-engine-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback: todas as rotas não-API servem index.html
# Necessário porque o frontend é single-file (67KB index.html)
# Sem isso, qualquer rota que não seja / ou /api/* retorna 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Architecture:
# - Frontend (static HTML/CSS/JS) served by Netlify
# - Backend (FastAPI Python) deployed separately on Render
# - /api/* proxied to Render backend via redirect above
# - Update the redirect "to" URL after Render service is live