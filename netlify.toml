[build]
  publish = "frontend"
  functions = "netlify/functions"
  command = "echo 'Static frontend + serverless backend via Netlify Functions'"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Architecture: Frontend (static HTML/CSS/JS) + Backend (FastAPI via mangum Lambda adapter)
# Both served from the same Netlify site — no separate Render backend needed.
# The /api/* redirect routes all API calls to the netlify/functions/api.py handler.