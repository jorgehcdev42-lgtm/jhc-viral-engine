services:
  - type: web
    name: jhc-viral-engine-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATA_ROOT
        value: "/tmp/jhc-data"
    autoDeploy: true

# NOTA IMPORTANTE SOBRE PERSISTÊNCIA:
# O plano gratuito do Render NÃO suporta discos persistentes.
# Os dados em /tmp/jhc-data serão perdidos quando o serviço reiniciar
# (após ~15 min de inatividade ou deploy).
#
# Para produção real com persistência, uma das opções:
# 1. Upgrade para plano Starter ($7/mês) → habilita disk persistente
# 2. Usar Supabase PostgreSQL gratuito como banco externo
# 3. Manter worker local no Mac + tunnel Cloudflare (temporário)
#
# Esta configuração é adequada para VALIDAÇÃO E TESTES do backend.
# Não use para operações automáticas de publicação sem persistência confirmada.